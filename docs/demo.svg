<svg xmlns="http://www.w3.org/2000/svg" width="1142" height="1156" viewBox="0 0 1142 1156" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace"><rect width="1142" height="1156" fill="#14181f"/><rect width="1142" height="44" fill="#222a36"/><circle cx="28" cy="22" r="8" fill="#ff5f57"/><circle cx="56" cy="22" r="8" fill="#febc2e"/><circle cx="84" cy="22" r="8" fill="#28c840"/><text x="130" y="29" font-size="22" fill="#8b95a7" xml:space="preserve">python -m examples.shop_requests.demo</text><text x="36" y="118" font-size="22" fill="#7fc8ff" font-weight="bold" xml:space="preserve">== 1. Intake process: confirmation, then one safe submission</text><text x="36" y="150" font-size="22" fill="#d8dee9" xml:space="preserve">   user 1: Hi, could you get SKU-1001 for me?</text><text x="36" y="182" font-size="22" fill="#a3e4a0" xml:space="preserve">      bot: Is this the item you want: SKU-1001? Send YES or NO.</text><text x="36" y="214" font-size="22" fill="#d8dee9" xml:space="preserve">   user 1: yes</text><text x="36" y="246" font-size="22" fill="#8b95a7" xml:space="preserve">   [shop API] received {'item': 'SKU-1001'}</text><text x="36" y="278" font-size="22" fill="#a3e4a0" xml:space="preserve">      bot: Request submitted: SKU-1001. I'll update you when its status changes.</text><text x="36" y="310" font-size="22" fill="#d8dee9" xml:space="preserve">   user 1: yes</text><text x="36" y="374" font-size="22" fill="#7fc8ff" font-weight="bold" xml:space="preserve">== 2. Status watcher process: strict parsing of the partner's feed</text><text x="36" y="406" font-size="22" fill="#d8dee9" xml:space="preserve">   feed #1: rejected by parser (need exactly one terminal status)</text><text x="36" y="438" font-size="22" fill="#d8dee9" xml:space="preserve">   feed #2: APPLIED</text><text x="36" y="470" font-size="22" fill="#d8dee9" xml:space="preserve">   feed #2 delivered again: REPLAY</text><text x="36" y="534" font-size="22" fill="#7fc8ff" font-weight="bold" xml:space="preserve">== 3. Notifier process: at-most-once delivery</text><text x="36" y="566" font-size="22" fill="#a3e4a0" xml:space="preserve">bot-&gt;chat: (reply to msg 2) SKU-1001 is now available.</text><text x="36" y="630" font-size="22" fill="#7fc8ff" font-weight="bold" xml:space="preserve">== 4. Prevention: the item is known now, so no second request is made</text><text x="36" y="662" font-size="22" fill="#d8dee9" xml:space="preserve">   user 2: SKU-1001 please</text><text x="36" y="694" font-size="22" fill="#a3e4a0" xml:space="preserve">      bot: Is this the item you want: SKU-1001? Send YES or NO.</text><text x="36" y="726" font-size="22" fill="#d8dee9" xml:space="preserve">   user 2: yes</text><text x="36" y="758" font-size="22" fill="#a3e4a0" xml:space="preserve">      bot: SKU-1001 is already available, so no request was needed.</text><text x="36" y="822" font-size="22" fill="#7fc8ff" font-weight="bold" xml:space="preserve">== 5. Projection process: read-only export for the business owner</text><text x="36" y="854" font-size="22" fill="#d8dee9" xml:space="preserve">   REQUESTS   1</text><text x="36" y="886" font-size="22" fill="#d8dee9" xml:space="preserve">   ADDED      1</text><text x="36" y="918" font-size="22" fill="#d8dee9" xml:space="preserve">   REJECTED   0</text><text x="36" y="950" font-size="22" fill="#d8dee9" xml:space="preserve">   PENDING    0</text><text x="36" y="1014" font-size="22" fill="#d8dee9" xml:space="preserve">   PREVENTED  1</text><text x="36" y="1046" font-size="22" fill="#d8dee9" xml:space="preserve">   files: &lt;tmp&gt;/export/dashboard.csv, &lt;tmp&gt;/export/requests.csv</text><text x="36" y="1110" font-size="22" fill="#d8dee9" xml:space="preserve">   health: OK: phase demo-finished, heartbeat 0s ago</text></svg>